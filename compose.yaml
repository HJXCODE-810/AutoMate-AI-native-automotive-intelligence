services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automate_os
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: automate_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - automate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automate -d automate_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  automate-postgres-data:
